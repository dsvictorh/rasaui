@if (active()) {
   <!-- 
      eslint-disable-next-line @angular-eslint/template/click-events-have-key-events
      -- click event meant only to be able to close by clicking outside, other meassures enabled for closing wiht accessibilty 
   -->
   <div
      #modal
      class="modal"
      role="dialog"
      [attr.class]="classes()"
      [cdkTrapFocus]="true"
      [cdkTrapFocusAutoCapture]="true"
      [ngClass]="{ closing: !open(), transparent: transparent() }"
      (click)="onClickOutside()">
      @if (closeOnClickOutside()) {
         <rasa-icon
            icon="close"
            [accessibleClick]="true"
            (accessibleClick)="onClickOutside()" />
      }

      <!-- 
         eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, 
         @angular-eslint/template/interactive-supports-focus 
         -- click event meant only to stop propagation of non-accessible click
      -->
      <div
         class="safewall"
         [ngClass]="{ safe: !transparent() }"
         (click)="$event.stopPropagation()">
         <ng-content />
      </div>
   </div>
}
